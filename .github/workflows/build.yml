name: Build and publish plugin

on:
  push:
    branches: [main]
    # Text-only changes don't make a new plugin build.
    paths-ignore:
      - "**.md"
      - "logo.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The version is DERIVED, not typed: major.minor come from build.yaml and the third part is
      # the workflow run number, so every build is unique and strictly increasing. Jellyfin refuses
      # to install a version it has already seen, so this replaces the old "bump the version by
      # hand or nothing publishes" step -- push, and a new installable build appears.
      - name: Compute version
        id: v
        run: |
          BASE=$(grep '^version:' build.yaml | cut -d'"' -f2)
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          VER="${MAJOR}.${MINOR}.${{ github.run_number }}.0"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Built version $VER (base $BASE, run ${{ github.run_number }})"
          echo "abi=$(grep '^targetAbi:' build.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "guid=$(grep '^guid:' build.yaml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          dotnet build PhoenicxTorBox.csproj -c Release -o out \
            -p:Version=${{ steps.v.outputs.version }} \
            -p:AssemblyVersion=${{ steps.v.outputs.version }} \
            -p:FileVersion=${{ steps.v.outputs.version }}

      - name: Package
        id: pkg
        run: |
          VER=${{ steps.v.outputs.version }}
          ZIP="torvia_${VER}.zip"
          mkdir pkg && cp out/PhoenicxTorBox.dll pkg/
          (cd pkg && zip -q "../$ZIP" *)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "md5=$(md5sum "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.v.outputs.version }}
          gh release create "v$VER" "${{ steps.pkg.outputs.zip }}" \
            --title "Torvia v$VER" \
            --notes "Install from the plugin repository: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json (or raw gh-pages manifest.json)."

      - name: Publish manifest.json to gh-pages
        run: |
          VER=${{ steps.v.outputs.version }}
          REPO=${{ github.repository }}
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > /tmp/manifest.json <<JSON
          [
            {
              "category": "General",
              "guid": "${{ steps.v.outputs.guid }}",
              "name": "Torvia",
              "owner": "${{ github.repository_owner }}",
              "overview": "Straight from TorBox to Jellyfin.",
              "description": "Reads your TorBox account and adds every finished movie and episode to Jellyfin. Watch history stays on your server for each user; the video streams from TorBox directly to the client. By Hanson - phoenicx.org",
              "imageUrl": "https://raw.githubusercontent.com/$REPO/main/logo.png",
              "versions": [
                {
                  "version": "$VER",
                  "changelog": "See https://github.com/$REPO/releases",
                  "targetAbi": "${{ steps.v.outputs.abi }}",
                  "sourceUrl": "https://github.com/$REPO/releases/download/v$VER/${{ steps.pkg.outputs.zip }}",
                  "checksum": "${{ steps.pkg.outputs.md5 }}",
                  "timestamp": "$TS"
                }
              ]
            }
          ]
          JSON
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rfq .
          cp /tmp/manifest.json .
          git add manifest.json
          git commit -qm "Publish manifest for v$VER"
          git push -f origin HEAD:gh-pages
